# Development override (T-003): dev/CI object store, in-network addresses, host ports on 127.0.0.1 and
# hot reload for the apps. Also the combination the CI job `compose-smoke` runs.
#
#   docker compose --env-file .env -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.dev.yml up
#
# NODE_ENV=development is set here (never read from .env): `next dev` requires it and the api/worker
# accept the dev credentials of .env.example only in this mode.
# Hot reload: the `dev` image stage (apps/*/Dockerfile) already holds node_modules and a first build;
# only source directories are bind-mounted, so a change in package.json requires `--build`.
# TODO(T-006, T-008): replace the tsc/node --watch commands with `pnpm --filter <app> dev` once the
# api and worker define a `dev` script.

x-dev-app-env: &dev-app-env
  NODE_ENV: development
  # In-network addresses override the host-oriented values of .env.
  DATABASE_URL: postgresql://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
  S3_ENDPOINT: http://s3:9000

services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"

  # S3-compatible object store for dev/CI only (ADR-0001 amendment 2026-10-16). Production uses OCI Object
  # Storage; application code talks plain S3 (SigV4, path-style, presigned URLs) through S3_* only.
  # No vendor console or admin API is used anywhere; the console stays disabled.
  s3:
    image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    restart: unless-stopped
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
      # In dev the root credential of the store is the pair the api/worker use.
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      RUSTFS_OBS_LOGGER_LEVEL: warn
    volumes:
      - s3-data:/data
    ports:
      - "127.0.0.1:${S3_PORT:-9000}:9000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "--max-time", "4", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - internal

  # One-shot: creates the private bucket with the standard S3 API, then exits. No public policy.
  s3-init:
    image: amazon/aws-cli:2.38.1@sha256:733d5be1015825e4038c6016f3fa9954868ddee1f611b73be795a9cc2e706bfd
    restart: "no"
    security_opt:
      - no-new-privileges:true
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID in .env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY in .env}
      AWS_DEFAULT_REGION: ${S3_REGION:?set S3_REGION in .env}
      AWS_ENDPOINT_URL: http://s3:9000
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      AWS_MAX_ATTEMPTS: "3"
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET in .env}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if aws s3api head-bucket --bucket "$$S3_BUCKET" --cli-connect-timeout 5 --cli-read-timeout 30 2>/dev/null; then
          echo "bucket $$S3_BUCKET already exists"
        else
          aws s3api create-bucket --bucket "$$S3_BUCKET" --cli-connect-timeout 5 --cli-read-timeout 30
          echo "bucket $$S3_BUCKET created"
        fi
    depends_on:
      s3:
        condition: service_healthy
    networks:
      - internal

  api:
    build:
      target: dev
    command:
      - sh
      - -ec
      - |
        pnpm --filter @linkedin-ops/api exec tsc -p tsconfig.build.json --watch --preserveWatchOutput &
        exec node --watch apps/api/dist/index.js
    environment:
      <<: *dev-app-env
    volumes:
      - ../../apps/api/src:/app/apps/api/src
      - ../../packages/contracts/src:/app/packages/contracts/src
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      s3-init:
        condition: service_completed_successfully

  worker:
    build:
      target: dev
    command:
      - sh
      - -ec
      - |
        pnpm --filter @linkedin-ops/worker exec tsc -p tsconfig.build.json --watch --preserveWatchOutput &
        exec node --watch apps/worker/dist/index.js
    environment:
      <<: *dev-app-env
    volumes:
      - ../../apps/worker/src:/app/apps/worker/src
      - ../../packages/contracts/src:/app/packages/contracts/src
    depends_on:
      s3-init:
        condition: service_completed_successfully

  web:
    build:
      target: dev
    command: ["pnpm", "--filter", "@linkedin-ops/web", "dev"]
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ../../apps/web/src:/app/apps/web/src
      - ../../packages/ui/src:/app/packages/ui/src
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      # `next dev` compiles routes on first request; give the first health probe more room than `next start`.
      start_period: 60s
      retries: 12

volumes:
  s3-data:
