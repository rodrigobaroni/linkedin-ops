# LinkedIn Ops — base Compose stack (T-003). Shared by development and production (T-056).
#
# Usage (from the repository root; `.env` is created from `.env.example`):
#   docker compose --env-file .env -f infra/docker/docker-compose.yml up -d --wait postgres s3
#   docker compose --env-file .env -f infra/docker/docker-compose.yml -f infra/docker/docker-compose.dev.yml up
#
# Rules (threat model TM-18, TM-21; task T-003):
# - Official images pinned by tag; third-party images (rustfs, aws-cli) also pinned by digest.
#   Digests are refreshed by Dependabot (docker ecosystem); official-image digests arrive with T-062.
# - Only Caddy publishes ports here (bound to CADDY_BIND_ADDRESS, 127.0.0.1 by default). Postgres and
#   the object store are reachable from the host only through docker-compose.dev.yml.
# - Interpolation defaults (`NAME:-value`) exist only so the stack boots in dev/CI without a .env; they must match
#   the "dev default" values in .env.example and are refused by the apps outside NODE_ENV=development.
# - `apps/web` never receives secrets (no env_file). Only api/worker read the root .env.

name: linkedin-ops

x-node-app: &node-app
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  networks:
    - internal

x-app-env: &app-env
  NODE_ENV: ${NODE_ENV:-development}
  APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # In-network addresses override the host-oriented values of .env.
  DATABASE_URL: postgresql://${POSTGRES_USER:-linkedin_ops}:${POSTGRES_PASSWORD:-linkedin_ops_dev}@postgres:5432/${POSTGRES_DB:-linkedin_ops}
  S3_ENDPOINT: http://s3:9000
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_BUCKET: ${S3_BUCKET:-linkedin-ops}
  S3_FORCE_PATH_STYLE: "true"

services:
  postgres:
    image: postgres:17.11-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-linkedin_ops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linkedin_ops_dev}
      POSTGRES_DB: ${POSTGRES_DB:-linkedin_ops}
      # pg-boss lives in its own schema of this same database (ADR-0002); no extra database needed.
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -h 127.0.0.1']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - internal

  # S3-compatible object store for dev/CI (ADR-0001 amendment 2026-10-16). Production uses OCI Object
  # Storage; application code talks plain S3 (SigV4, path-style, presigned URLs) through S3_* only.
  # No vendor console or admin API is used anywhere; the console port stays disabled.
  s3:
    image: rustfs/rustfs:1.0.1@sha256:1803faef57627e2d9c2e7d89d655d712ddded5389040054987163043fecb6a3c
    restart: unless-stopped
    user: "10001:10001"
    security_opt:
      - no-new-privileges:true
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-linkedin_ops_dev}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-linkedin_ops_dev_secret}
      RUSTFS_OBS_LOGGER_LEVEL: warn
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    networks:
      - internal

  # One-shot: creates the private bucket with the standard S3 API, then exits. No public policy.
  s3-init:
    image: amazon/aws-cli:2.38.1@sha256:733d5be1015825e4038c6016f3fa9954868ddee1f611b73be795a9cc2e706bfd
    restart: "no"
    security_opt:
      - no-new-privileges:true
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-linkedin_ops_dev}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-linkedin_ops_dev_secret}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      AWS_ENDPOINT_URL: http://s3:9000
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      S3_BUCKET: ${S3_BUCKET:-linkedin-ops}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if aws s3api head-bucket --bucket "$$S3_BUCKET" 2>/dev/null; then
          echo "bucket $$S3_BUCKET already exists"
        else
          aws s3api create-bucket --bucket "$$S3_BUCKET"
          echo "bucket $$S3_BUCKET created"
        fi
    depends_on:
      s3:
        condition: service_healthy
    networks:
      - internal

  api:
    <<: *node-app
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: linkedin-ops/api:${IMAGE_TAG:-dev}
    env_file:
      - path: ../../.env
        required: false
    environment:
      <<: *app-env
      PORT: "3001"
    # TODO(T-008): HTTP healthcheck on GET /health (contract in packages/contracts resources/health.ts)
    # once the NestJS app exists; until then the placeholder process exits right after start.
    depends_on:
      postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully

  worker:
    <<: *node-app
    build:
      context: ../..
      dockerfile: apps/worker/Dockerfile
    image: linkedin-ops/worker:${IMAGE_TAG:-dev}
    env_file:
      - path: ../../.env
        required: false
    environment:
      <<: *app-env
    # TODO(T-006): liveness check for the pg-boss worker (no HTTP; e.g. heartbeat file or pg-boss
    # `getQueueSize`) once the worker runtime exists.
    depends_on:
      postgres:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully

  web:
    <<: *node-app
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    image: linkedin-ops/web:${IMAGE_TAG:-dev}
    # Presentation only: no env_file, no secrets (ADR-0001).
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: "3000"
      HOSTNAME: 0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "${CADDY_BIND_ADDRESS:-127.0.0.1}:80:80"
      - "${CADDY_BIND_ADDRESS:-127.0.0.1}:443:443"
      - "${CADDY_BIND_ADDRESS:-127.0.0.1}:443:443/udp"
    environment:
      CADDY_SITE_ADDRESS: ${CADDY_SITE_ADDRESS:-localhost}
      CADDY_TLS: ${CADDY_TLS:-internal}
      CADDY_HSTS_MAX_AGE: ${CADDY_HSTS_MAX_AGE:-0}
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      # Admin API listens on localhost:2019 inside the container only (never published).
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:2019/config/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    depends_on:
      - web
      - api
    networks:
      - internal

volumes:
  pg-data:
  s3-data:
  caddy-data:
  caddy-config:

networks:
  internal:
    driver: bridge
