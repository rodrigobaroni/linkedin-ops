# Security scans (T-002, gate G-06 of docs/security/threat-model.md; extended with triage in T-062).
# - gitleaks (`.github/scripts/gitleaks-scan.sh`): CLI at a fixed version verified by SHA-256 (TM-21).
#   On pull_request/push it scans the commit range (merge commits included) AND the checked-out
#   working tree; on schedule/manual runs it scans the full history and the working tree. Any finding
#   fails the job. False positives are suppressed by fingerprint in `.gitleaksignore` only.
# - Trivy (filesystem): known vulnerabilities in `pnpm-lock.yaml` and misconfigurations in infra files.
#   Only HIGH/CRITICAL are evaluated and every one of them fails the job, fixed or not; accepted
#   findings go to `.trivyignore` with owner and expiry (process in CONTRIBUTING.md). T-062 adds image
#   scans and the triage document.
# No repository secrets are required or used.
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 9 * * 1" # Mondays 09:00 UTC (06:00 America/Sao_Paulo): catch new CVEs without code changes
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Scan commits and working tree
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          REPORT_DIR: ${{ runner.temp }}/gitleaks-reports
        run: |
          case "$EVENT" in
            pull_request) .github/scripts/gitleaks-scan.sh range "$PR_BASE" "$PR_HEAD" ;;
            push) .github/scripts/gitleaks-scan.sh range "$PUSH_BEFORE" "$PUSH_AFTER" ;;
            *) .github/scripts/gitleaks-scan.sh full ;;
          esac

      - name: Upload SARIF reports (only when secrets were found)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitleaks-sarif
          path: ${{ runner.temp }}/gitleaks-reports/*.sarif
          retention-days: 14
          if-no-files-found: ignore

  trivy:
    name: Dependencies and config (Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Trivy filesystem scan (vuln + misconfig)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          # Fallback registries avoid ghcr.io rate limits when pulling the vulnerability DB.
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db:2,ghcr.io/aquasecurity/trivy-db:2
          TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db:1,ghcr.io/aquasecurity/trivy-java-db:1
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          exit-code: "1"
          # Every HIGH/CRITICAL fails, fixed or not. Accepted findings: .trivyignore (owner + expiry).
          ignore-unfixed: false
          trivyignores: .trivyignore
          format: table
          hide-progress: true
          skip-dirs: node_modules,.turbo
