# CI pipeline (T-002). Required for every PR into `main` and for every push to `main`.
# Checks: lint, typecheck, test, build (Turborepo, cached), Prettier, Conventional Commits.
# Actions are pinned by commit SHA (threat model TM-21); Dependabot keeps the pins fresh.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0 # do not install git hooks on the runner
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1
  CI: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm (version from package.json#packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node (version from .nvmrc) and pnpm store cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Restore Turborepo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, test, build
        run: pnpm turbo lint typecheck test build

      - name: Prettier
        run: pnpm format:check

  commitlint:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history, needed to lint the PR commit range)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup pnpm (version from package.json#packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node (version from .nvmrc) and pnpm store cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint PR commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  # --- db-integration (T-005) ------------------------------------------------------------------
  # Docker is not available on the local machine (decision 2026-10-13), so the database baseline is
  # proven here: `pnpm db:migrate` from an empty PostgreSQL 17 service, `pnpm db:seed` twice (idempotent),
  # then the Testcontainers suite of packages/domain (append-only triggers, unique/partial indexes,
  # mandatory timezone). Credentials below are throwaway values for the ephemeral CI service only.
  db-integration:
    name: Database (migrate, seed, Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # Tag + digest (TM-21); same reference in the Testcontainers suite and in the Compose file
        # (T-003). Dependabot `docker` ecosystem (enabled by T-003) proposes digest updates.
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: linkedin_ops_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d linkedin_ops_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/linkedin_ops_ci
      # db:seed / db:reset refuse any NODE_ENV outside {development, test} (packages/domain/src/env/guards.ts).
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm (version from package.json#packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node (version from .nvmrc) and pnpm store cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema and build the domain package (generates the client)
        run: |
          pnpm --filter @linkedin-ops/domain db:validate
          pnpm turbo build --filter=@linkedin-ops/domain

      - name: Migrate from scratch (acceptance criterion `pnpm db:migrate`)
        run: pnpm db:migrate

      - name: Seed twice (acceptance criterion `pnpm db:seed`, idempotent)
        run: |
          pnpm db:seed
          pnpm db:seed

      - name: No pending migrations
        run: pnpm db:migrate:status

      - name: Integration tests (Testcontainers, postgres:17-alpine)
        run: pnpm db:test

      - name: API readiness and auth against PostgreSQL (Testcontainers, T-008/T-015)
        run: pnpm --filter @linkedin-ops/api test:integration

      - name: Worker on pg-boss (Testcontainers, Career PR 1)
        run: |
          pnpm turbo build --filter=@linkedin-ops/worker^...
          pnpm --filter @linkedin-ops/worker test:integration

  # --- compose-smoke (T-003) ---------------------------------------------------------------------
  # Decision by Rodrigo (2026-10-13): Docker is not available on the local machine, so the Compose stack
  # is validated here, in the combination developers run (base + docker-compose.dev.yml). Credentials are
  # generated per run (never committed); the base file must refuse to render without them (fail closed,
  # PR #80 review); postgres and the S3 store must become healthy; an S3 round-trip (PUT -> presigned GET
  # via curl, sha256 compared -> authenticated HEAD; unsigned and wrong-method requests must be rejected)
  # catches S3-implementation divergences (Atlas condition); the production images (runtime stage) must
  # build and serve; Caddy must terminate TLS for web and api on one host with the security headers and
  # its access log must not retain OAuth query parameters (code, state). The daily pnpm scripts
  # (dev:infra, dev:infra:down) are executed literally so they cannot drift from the Compose files.
  compose-smoke:
    name: Compose smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Colon-separated: the dev override is part of the stack under test.
      COMPOSE_FILE: infra/docker/docker-compose.yml:infra/docker/docker-compose.dev.yml
      COMPOSE_ENV_FILES: .env
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create .env with random credentials (not committed, masked in logs)
        run: |
          set -euo pipefail
          pg_password="$(openssl rand -hex 24)"
          s3_access_key="ci$(openssl rand -hex 8)"
          s3_secret_key="$(openssl rand -hex 32)"
          # The api validates its environment fail-closed (validateRuntimeEnv, T-008): outside development the
          # change-me placeholders are refused, SESSION_SECRET needs >= 32 bytes and ENCRYPTION_KEY must be
          # base64 of exactly 32 bytes. The runtime image is smoked with NODE_ENV=production below.
          session_secret="$(openssl rand -base64 48)"
          encryption_key="$(openssl rand -base64 32)"
          echo "::add-mask::$pg_password"
          echo "::add-mask::$s3_access_key"
          echo "::add-mask::$s3_secret_key"
          echo "::add-mask::$session_secret"
          echo "::add-mask::$encryption_key"
          # Start from the committed template, then replace the dev defaults with per-run secrets.
          grep -Ev '^(POSTGRES_PASSWORD|DATABASE_URL|S3_ACCESS_KEY_ID|S3_SECRET_ACCESS_KEY|SESSION_SECRET|ENCRYPTION_KEY|APP_BASE_URL)=' .env.example > .env
          {
            echo "POSTGRES_PASSWORD=$pg_password"
            echo "DATABASE_URL=postgresql://linkedin_ops:$pg_password@localhost:5432/linkedin_ops"
            echo "S3_ACCESS_KEY_ID=$s3_access_key"
            echo "S3_SECRET_ACCESS_KEY=$s3_secret_key"
            echo "SESSION_SECRET=$session_secret"
            echo "ENCRYPTION_KEY=$encryption_key"
            # Caddy serves https://localhost; the api compares the Origin of every mutation with this value.
            echo "APP_BASE_URL=https://localhost"
          } >> .env

      - name: Fail closed on missing variables and template coverage
        run: |
          set -euo pipefail
          required="POSTGRES_USER POSTGRES_PASSWORD POSTGRES_DB POSTGRES_PORT DATABASE_URL APP_BASE_URL API_PORT SESSION_SECRET ENCRYPTION_KEY S3_ENDPOINT S3_REGION S3_BUCKET S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY S3_FORCE_PATH_STYLE S3_PORT CADDY_SITE_ADDRESS CADDY_TLS CADDY_BIND_ADDRESS CADDY_HSTS_MAX_AGE"
          status=0
          for name in $required; do
            value="$(grep -E "^${name}=" .env | head -n1 | cut -d= -f2- || true)"
            if [ -z "$value" ]; then echo "::error::$name is missing or empty in .env"; status=1; fi
          done
          # Every ${VAR} the Compose files interpolate must be documented in .env.example (T-003 criterion).
          # shellcheck disable=SC2016 # regex, not a shell expansion
          for name in $(grep -ohE '\$\{[A-Z0-9_]+' infra/docker/docker-compose*.yml | tr -d '${' | sort -u); do
            if ! grep -qE "^${name}=" .env.example; then echo "::error::$name is used by Compose but absent from .env.example"; status=1; fi
          done
          if grep -qE '^(POSTGRES_PASSWORD|S3_SECRET_ACCESS_KEY)=linkedin_ops' .env; then
            echo "::error::dev default credentials leaked into the CI .env"; status=1
          fi
          exit "$status"

      - name: Validate the Compose files (dev combination and base alone) and the Caddyfile
        run: |
          set -euo pipefail
          docker compose version
          docker compose config -q
          docker compose -f infra/docker/docker-compose.yml config -q
          docker compose run --rm --no-deps caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Base file fails closed without .env (no interpolation defaults for credentials)
        run: |
          set -euo pipefail
          # No --env-file, no shell variables: every `${VAR:?}` must stop `config` before anything starts.
          if output="$(env -u COMPOSE_ENV_FILES docker compose --env-file /dev/null -f infra/docker/docker-compose.yml config -q 2>&1)"; then
            echo "::error::the base Compose file rendered without .env; credentials must have no defaults"
            exit 1
          fi
          if ! printf '%s\n' "$output" | grep -qi 'required variable'; then
            echo "::error::config failed for another reason: $output"
            exit 1
          fi
          echo "base file refused to render without .env: $(printf '%s\n' "$output" | grep -i -m1 'required variable')"

      - name: Setup pnpm (the package.json Compose scripts are part of what this job proves)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node (version from .nvmrc; engine-strict refuses the runner's default Node)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: pnpm dev:infra starts postgres and s3, waits for health checks and creates the bucket
        # Literally the daily command (PR #80 review, Atlas round 2): `pnpm run compose` must carry both
        # Compose files, otherwise `s3`/`s3-init` are unknown services.
        run: pnpm dev:infra

      - name: Show services
        run: docker compose ps

      - name: Postgres accepts the DATABASE_URL credentials
        run: |
          set -euo pipefail
          set -a; . ./.env; set +a
          docker compose exec -T postgres pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          docker compose exec -T postgres psql "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@127.0.0.1:5432/${POSTGRES_DB}" -tAc 'select 1' | grep -qx 1

      - name: S3 round-trip (PUT -> presigned GET -> HEAD, sha256 compared) and private bucket
        run: |
          set -euo pipefail
          set -a; . ./.env; set +a
          workdir="$(mktemp -d)"
          head -c 65536 /dev/urandom > "$workdir/payload.bin"
          expected="$(sha256sum "$workdir/payload.bin" | cut -d' ' -f1)"
          key="smoke/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.bin"
          # Standard S3 only (SigV4, path-style): PUT, presign, HEAD through the AWS CLI. The single-quoted
          # script is expanded inside the container, on purpose.
          # shellcheck disable=SC2016
          presigned="$(docker compose run --rm --no-deps -T --entrypoint "" -v "$workdir:/smoke:ro" \
            -e KEY="$key" s3-init sh -ec '
              aws configure set default.s3.addressing_style path
              aws configure set default.cli_connect_timeout 5
              aws configure set default.cli_read_timeout 60
              aws s3api put-object --bucket "$S3_BUCKET" --key "$KEY" --body /smoke/payload.bin > /dev/null
              length="$(aws s3api head-object --bucket "$S3_BUCKET" --key "$KEY" --query ContentLength --output text)"
              [ "$length" = 65536 ] || { echo "HEAD returned ContentLength=$length, expected 65536" >&2; exit 1; }
              aws s3 presign "s3://$S3_BUCKET/$KEY" --expires-in 300' | tr -d '\r')"
          echo "::add-mask::$presigned"
          echo "presigned URL query parameters: $(printf '%s' "$presigned" | sed 's/^[^?]*?//' | tr '&' '\n' | cut -d= -f1 | tr '\n' ' ')"
          # Download via plain HTTP with the presigned URL (curl inside the store container, same network).
          # The inner script always exits 0 and reports the HTTP status, so a rejection prints the S3 error body.
          get_report="$(docker compose exec -T s3 sh -c "code=\$(curl -sS --connect-timeout 5 --max-time 60 -o /tmp/smoke.bin -w '%{http_code}' '$presigned'); echo \"status=\$code\"; [ \"\$code\" = 200 ] || head -c 2000 /tmp/smoke.bin" \
            | sed -E 's/X-Amz-Signature=[0-9a-f]+/X-Amz-Signature=REDACTED/g; s/X-Amz-Credential=[^&" ]+/X-Amz-Credential=REDACTED/g')"
          echo "presigned GET: $get_report"
          case "$get_report" in status=200*) ;; *) echo "::error::presigned GET was rejected by the S3 store"; exit 1 ;; esac
          actual="$(docker compose exec -T s3 sh -ec "sha256sum /tmp/smoke.bin | cut -d' ' -f1")"
          if [ "$actual" != "$expected" ]; then echo "::error::sha256 mismatch after presigned GET"; exit 1; fi
          # SigV4 signs the HTTP method: a HEAD with a GET-presigned URL must be rejected (same as AWS S3).
          code="$(docker compose exec -T s3 sh -c "curl -s --connect-timeout 5 --max-time 30 -o /dev/null -w '%{http_code}' -I '$presigned'")"
          if [ "$code" != "403" ]; then echo "::error::HEAD with a GET-presigned URL returned $code, expected 403"; exit 1; fi
          # Bucket must be private: an unsigned request is rejected.
          code="$(docker compose exec -T s3 sh -ec "curl -s --connect-timeout 5 --max-time 30 -o /dev/null -w '%{http_code}' 'http://127.0.0.1:9000/${S3_BUCKET}/${key}'")"
          if [ "$code" != "403" ]; then echo "::error::anonymous GET returned $code, expected 403"; exit 1; fi
          echo "S3 round-trip OK (sha256 $expected)"

      - name: Build the production images (runtime stage) and smoke them outside Compose
        run: |
          set -euo pipefail
          # The dev combination builds the `dev` stage; the images that ship are built from the base file alone.
          IMAGE_TAG=smoke-runtime docker compose -f infra/docker/docker-compose.yml build api web worker
          docker run -d --rm --name smoke-web linkedin-ops/web:smoke-runtime
          # The api image refuses to start without a valid production environment (validateRuntimeEnv, T-008):
          # feed it the per-run .env and pin NODE_ENV=production (the .env carries development). The database is not
          # reachable from this standalone container, which is fine: /health never touches it (/ready would).
          docker run -d --rm --name smoke-api --env-file .env -e NODE_ENV=production linkedin-ops/api:smoke-runtime
          wait_http() { # <container> <url>: busybox wget inside the image, up to 60 s
            for _ in $(seq 1 30); do
              if docker exec "$1" wget -q -T 5 -O /dev/null "$2"; then return 0; fi
              sleep 2
            done
            echo "::error::$1 did not answer $2 within 60 s"
            docker logs "$1" 2>&1 | tail -n 50
            return 1
          }
          wait_http smoke-web http://127.0.0.1:3000/
          wait_http smoke-api http://127.0.0.1:3001/api/v1/health
          body="$(docker exec smoke-web wget -q -T 15 -O - http://127.0.0.1:3000/)"
          if ! printf '%s\n' "$body" | grep -qi '<html'; then
            echo "::error::the web runtime image did not answer GET / with an HTML document"
            printf '%s\n' "$body" | head -c 600; echo
            exit 1
          fi
          health="$(docker exec smoke-api wget -q -T 15 -O - http://127.0.0.1:3001/api/v1/health)"
          if ! printf '%s\n' "$health" | jq -e '.status == "ok"' > /dev/null; then
            echo "::error::the api runtime image health body is not the HealthStatus contract: $health"
            exit 1
          fi
          # The worker (pg-boss, Career PR 1) loads all its modules (domain with argon2 and the Prisma client,
          # editorial-engine, pg-boss) and then refuses to start without a valid production environment: it must
          # exit non-zero naming the variables, never their values. Its healthcheck script must be present and
          # report unhealthy when no heartbeat was written. Running against PostgreSQL is covered by the dev
          # combination below and by the db-integration job.
          set +e
          worker_out="$(timeout 60 docker run --rm linkedin-ops/worker:smoke-runtime 2>&1)"; worker_rc=$?
          timeout 30 docker run --rm --entrypoint node linkedin-ops/worker:smoke-runtime apps/worker/dist/health/healthcheck.js; health_rc=$?
          set -e
          if [ "$worker_rc" -eq 0 ] || ! printf '%s\n' "$worker_out" | grep -q 'Invalid runtime environment'; then
            echo "::error::the worker runtime image did not fail closed without environment (rc=$worker_rc)"
            printf '%s\n' "$worker_out" | tail -n 30
            exit 1
          fi
          if [ "$health_rc" -ne 1 ]; then echo "::error::worker healthcheck returned $health_rc without a heartbeat"; exit 1; fi
          docker rm -f smoke-web smoke-api > /dev/null
          echo "runtime images OK: web serves HTML ($(printf '%s' "$body" | wc -c) bytes), api health $health"

      - name: Runtime api image reads a CV PDF through the real upload route (unpdf + worker_thread on alpine)
        # Crivo, PR #88: POST /career/cv with the committed fictitious CV against the runtime image, on the
        # stack's network and database, proves that pdf.js (unpdf, pure JS) and the parsing worker_thread run
        # in the shipped node:alpine image. Architecture: the runner's (amd64); ARM64 is proven by the deploy.
        # Since PR #92 the upload enqueues `cv.extract` in the draft's transaction and the api never migrates the
        # pgboss schema (the worker owns it, ADR-0002): as in production, the worker runtime image boots first,
        # migrates pgboss and provisions the queues, and only then the api starts.
        run: |
          set -euo pipefail
          set -a; . ./.env; set +a
          network=linkedin-ops_internal
          db_url="postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
          echo "::add-mask::$db_url"
          # Migrations with the toolchain stage, exactly like infra/deploy/deploy-shared-host.sh does.
          docker build -q --target build -f apps/api/Dockerfile -t linkedin-ops/api-tools:smoke . > /dev/null
          docker run --rm --network "$network" -e DATABASE_URL="$db_url" linkedin-ops/api-tools:smoke pnpm db:migrate
          # The worker runtime image with the minimum validateWorkerEnv accepts in production (explicit -e only, no
          # .env): a throwaway OpenAI key that is never used. It is stopped once pgboss is ready and before any
          # upload, so it never consumes the job (a call with that key would fail the draft and erase its text,
          # which this step inspects below).
          fake_openai_key="sk-smoke-$(openssl rand -hex 16)"
          echo "::add-mask::$fake_openai_key"
          docker run -d --rm --name smoke-worker --network "$network" \
            -e NODE_ENV=production -e LOG_LEVEL=info -e DATABASE_URL="$db_url" \
            -e OPENAI_API_KEY="$fake_openai_key" -e OPENAI_MODEL=gpt-smoke linkedin-ops/worker:smoke-runtime > /dev/null
          pgboss_ready=
          for _ in $(seq 1 30); do
            if [ "$(docker compose exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tA \
              -c "SELECT count(*) FROM pgboss.queue WHERE name IN ('cv.extract', 'cv.extract.dlq')" 2>/dev/null)" = 2 ]; then
              pgboss_ready=1; break
            fi
            sleep 2
          done
          if [ -z "$pgboss_ready" ]; then
            echo "::error::the worker runtime image did not migrate pgboss and provision cv.extract within 60 s"
            docker logs smoke-worker 2>&1 | tail -n 50
            exit 1
          fi
          docker stop -t 30 smoke-worker > /dev/null
          # A throwaway owner and session (only the cookie's SHA-256 is stored, as at login).
          user_id="$(cat /proc/sys/kernel/random/uuid)"
          session_id="$(cat /proc/sys/kernel/random/uuid)"
          cookie="$(openssl rand -hex 32)"
          echo "::add-mask::$cookie"
          secret_hash="$(printf '%s' "$cookie" | sha256sum | cut -d' ' -f1)"
          docker compose exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -q \
            -c "INSERT INTO users (id, email, password_hash, name, updated_at) VALUES ('$user_id', 'smoke-$user_id@example.test', 'not-a-login', 'Smoke', now())" \
            -c "INSERT INTO sessions (id, user_id, secret_hash, expires_at) VALUES ('$session_id', '$user_id', '$secret_hash', now() + interval '1 hour')"
          docker run -d --rm --name smoke-api-cv --network "$network" -p 127.0.0.1:3101:3001 \
            --env-file .env -e NODE_ENV=production -e DATABASE_URL="$db_url" linkedin-ops/api:smoke-runtime
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 5 -o /dev/null http://127.0.0.1:3101/api/v1/health; then break; fi
            sleep 2
          done
          upload() { # <file> <type>: prints the HTTP status, body in $RUNNER_TEMP/cv-upload.json
            curl -sS --max-time 60 -o "$RUNNER_TEMP/cv-upload.json" -w '%{http_code}' \
              -H "Origin: $APP_BASE_URL" -H "X-Requested-With: linkedin-ops" -H "Cookie: __Host-session=$cookie" \
              -F "file=@$1;type=$2" http://127.0.0.1:3101/api/v1/career/cv
          }
          # The api starts its producer at bootstrap and retries in the background; tolerate a short 503 window.
          code=
          for _ in $(seq 1 15); do
            code="$(upload apps/api/test/fixtures/cv-ficticio.pdf application/pdf)"
            if [ "$code" != 503 ]; then break; fi
            sleep 2
          done
          if [ "$code" != 202 ] || ! jq -e '.status == "EXTRACTING" and .draft.status == "EXTRACTING"' "$RUNNER_TEMP/cv-upload.json" > /dev/null; then
            echo "::error::POST /career/cv on the runtime image returned $code: $(cat "$RUNNER_TEMP/cv-upload.json")"
            docker logs smoke-api-cv 2>&1 | tail -n 50
            exit 1
          fi
          draft_id="$(jq -r '.id' "$RUNNER_TEMP/cv-upload.json")"
          # The text really came out of the PDF (inside the parsing thread of the runtime image).
          found="$(docker compose exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tA \
            -c "SELECT position('Universidade Imaginária' in extracted_text) > 0 FROM cv_bases WHERE id = '$draft_id'")"
          if [ "$found" != t ]; then echo "::error::the stored draft does not hold the fictitious CV text"; exit 1; fi
          # Its cv.extract job was committed with the draft: one job, ids only (never the CV text).
          job="$(docker compose exec -T postgres psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tA \
            -c "SELECT count(*) || ':' || bool_and(data->>'cvBaseId' = '$draft_id') || ':' || bool_and(position('Imaginária' in data::text) = 0) FROM pgboss.job WHERE name = 'cv.extract' AND singleton_key = '$draft_id'")"
          if [ "$job" != "1:true:true" ]; then echo "::error::expected exactly one id-only cv.extract job for the draft, got $job"; exit 1; fi
          # And a non-PDF is refused by its signature.
          printf 'PK\003\004 not a pdf' > "$RUNNER_TEMP/not-a-pdf.pdf"
          code="$(upload "$RUNNER_TEMP/not-a-pdf.pdf" application/pdf)"
          if [ "$code" != 415 ]; then echo "::error::a non-PDF upload returned $code, expected 415"; exit 1; fi
          docker rm -f smoke-api-cv > /dev/null
          echo "runtime api read the fictitious CV through POST /career/cv (draft $draft_id, cv.extract enqueued); non-PDF refused (415)"

      - name: Build the dev images and start web, api and caddy (dev combination)
        run: |
          set -euo pipefail
          docker compose build api web worker
          # The worker joins the stack (Career PR 1): healthy = pg-boss started on PostgreSQL and heartbeating.
          docker compose up -d --wait web api caddy worker
          docker compose ps

      - name: Each service receives exactly its own variables (effective environment, names only)
        run: |
          set -euo pipefail
          # Sentinela, PR #89: an exact allowlist per service. The variables Compose injects are the container's
          # names minus the image's own ENV names; any extra or missing name fails. Values are never printed.
          injected() { # <service>: names set by Compose for the running container, sorted
            local cid image
            cid="$(docker compose ps -q "$1")"
            image="$(docker inspect -f '{{.Image}}' "$cid")"
            comm -23 \
              <(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$cid" | cut -d= -f1 | sed '/^$/d' | sort -u) \
              <(docker image inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "$image" | cut -d= -f1 | sed '/^$/d' | sort -u)
          }
          image_names() { # <service>: the image's own ENV names (allowed to be overridden by Compose)
            docker image inspect -f '{{range .Config.Env}}{{println .}}{{end}}' \
              "$(docker inspect -f '{{.Image}}' "$(docker compose ps -q "$1")")" | cut -d= -f1 | sed '/^$/d' | sort -u
          }
          status=0
          check() { # <service> <allowed names...>
            local service=$1; shift
            local allowed actual extra missing
            allowed="$(printf '%s\n' "$@" | sort -u)"
            actual="$(injected "$service")"
            extra="$(comm -23 <(printf '%s\n' "$actual" | sed '/^$/d') <(printf '%s\n' "$allowed"))"
            # An allowed name may come from the image ENV (e.g. NODE_ENV); only names Compose must add count as missing.
            missing="$(comm -23 <(printf '%s\n' "$allowed") <(printf '%s\n' "$actual" "$(image_names "$service")" | sed '/^$/d' | sort -u))"
            if [ -n "$extra" ]; then echo "::error::$service receives unexpected variables: $(tr '\n' ' ' <<<"$extra")"; status=1; fi
            if [ -n "$missing" ]; then echo "::error::$service is missing variables: $(tr '\n' ' ' <<<"$missing")"; status=1; fi
          }
          check api NODE_ENV APP_TIMEZONE LOG_LEVEL DATABASE_URL \
            S3_ENDPOINT S3_REGION S3_BUCKET S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY S3_FORCE_PATH_STYLE \
            APP_BASE_URL SESSION_SECRET ENCRYPTION_KEY ENCRYPTION_KEYS ENCRYPTION_ACTIVE_KEY_VERSION \
            LINKEDIN_CLIENT_ID LINKEDIN_CLIENT_SECRET LINKEDIN_REDIRECT_URI LINKEDIN_PKCE \
            TRUSTED_PROXY_CIDRS JOB_FETCH_LINKEDIN API_PORT API_HOST
          check worker NODE_ENV APP_TIMEZONE LOG_LEVEL DATABASE_URL OPENAI_API_KEY OPENAI_MODEL JOB_FETCH_LINKEDIN
          check web NODE_ENV PORT HOSTNAME NEXT_TELEMETRY_DISABLED
          # Explicit denials on top of the allowlists (defence in depth).
          worker_env="$(injected worker)"
          for var in S3_ACCESS_KEY_ID S3_SECRET_ACCESS_KEY SESSION_SECRET ENCRYPTION_KEY ENCRYPTION_KEYS \
            LINKEDIN_CLIENT_SECRET APP_BASE_URL; do
            if printf '%s\n' "$worker_env" | grep -qx "$var"; then echo "::error::worker must not receive $var"; status=1; fi
          done
          if injected api | grep -qx OPENAI_API_KEY; then echo "::error::api must not receive OPENAI_API_KEY"; status=1; fi
          exit "$status"

      - name: Caddy serves web and api on one TLS host with the security headers
        run: |
          set -euo pipefail
          ca="$RUNNER_TEMP/caddy-ca.crt"
          docker compose exec -T caddy cat /data/caddy/pki/authorities/local/root.crt > "$ca"
          # Bounded and retried (Crivo 2): connect 5 s, total 30 s, 5 retries on any error while `next dev` warms up.
          curl_tls() { curl -4 -sS --cacert "$ca" --connect-timeout 5 --max-time 30 --retry 5 --retry-delay 3 --retry-all-errors "$@"; }
          workdir="$(mktemp -d)"
          # web: / redirects to the landing page; follow it and require an HTML document.
          code="$(curl_tls -L -o "$workdir/web.html" -D "$workdir/web.headers" -w '%{http_code}' https://localhost/)"
          if [ "$code" != 200 ]; then echo "::error::https://localhost/ returned $code"; cat "$workdir/web.headers"; exit 1; fi
          grep -qi '<html' "$workdir/web.html" || { echo "::error::https://localhost/ did not return an HTML document"; exit 1; }
          # api: same host, /api/* -> api:3001, JSON matching the HealthStatus contract.
          code="$(curl_tls -o "$workdir/health.json" -D "$workdir/api.headers" -w '%{http_code}' https://localhost/api/v1/health)"
          if [ "$code" != 200 ]; then echo "::error::https://localhost/api/v1/health returned $code"; cat "$workdir/api.headers"; exit 1; fi
          jq -e '.status == "ok"' "$workdir/health.json" > /dev/null || { echo "::error::health body is not the HealthStatus contract: $(cat "$workdir/health.json")"; exit 1; }
          grep -qi '^content-type: application/json' "$workdir/api.headers" || { echo "::error::health is not served as JSON"; cat "$workdir/api.headers"; exit 1; }
          # Security headers set by Caddy (deferred, so they also apply to proxied responses) and no server banners.
          for f in web.headers api.headers; do
            for h in 'x-content-type-options: nosniff' 'x-frame-options: DENY' 'referrer-policy: no-referrer' 'strict-transport-security:'; do
              grep -qi "^$h" "$workdir/$f" || { echo "::error::$f lacks '$h'"; cat "$workdir/$f"; exit 1; }
            done
            if grep -qiE '^(server|x-powered-by):' "$workdir/$f"; then echo "::error::$f leaks Server/X-Powered-By"; cat "$workdir/$f"; exit 1; fi
          done
          echo "Caddy OK: https://localhost/ -> web (HTML), https://localhost/api/v1/health -> api ($(cat "$workdir/health.json")), security headers present"

      - name: Caddy access log does not retain OAuth query parameters
        run: |
          set -euo pipefail
          ca="$RUNNER_TEMP/caddy-ca.crt"
          curl_tls() { curl -4 -sS --cacert "$ca" --connect-timeout 5 --max-time 30 --retry 3 --retry-delay 2 --retry-all-errors "$@"; }
          code_value="smokecode$(openssl rand -hex 8)"
          state_value="smokestate$(openssl rand -hex 8)"
          csrf_value="smokecsrf$(openssl rand -hex 8)"
          # Synthetic callback-shaped request: the filter must drop code/state and keep the other parameter;
          # the X-CSRF-Token request header must not reach the log either (PR #82 review, Sentinela S-1).
          curl_tls -o /dev/null -H "X-CSRF-Token: ${csrf_value}" \
            "https://localhost/api/v1/health?code=${code_value}&state=${state_value}&keep=visible"
          sleep 2
          logs="$(docker compose logs --no-color --no-log-prefix caddy)"
          if ! printf '%s\n' "$logs" | grep -qF '"uri":"/api/v1/health?keep=visible"'; then
            echo "::error::expected an access-log entry with uri /api/v1/health?keep=visible (code/state removed)"
            printf '%s\n' "$logs" | grep -F '/api/v1/health' | tail -n 5 || true
            exit 1
          fi
          if printf '%s\n' "$logs" | grep -qE "${code_value}|${state_value}|${csrf_value}"; then
            echo "::error::code/state/X-CSRF-Token values reached the Caddy access log"
            exit 1
          fi
          echo "Caddy access log OK: code/state removed from request>uri, X-CSRF-Token dropped, other parameters kept"

      - name: pnpm dev:infra:down stops the stack (volumes kept, as documented)
        run: |
          set -euo pipefail
          pnpm dev:infra:down
          remaining="$(docker compose ps -aq | wc -l | tr -d ' ')"
          if [ "$remaining" != 0 ]; then echo "::error::$remaining container(s) still present after pnpm dev:infra:down"; docker compose ps -a; exit 1; fi
          docker volume ls -q --filter label=com.docker.compose.project=linkedin-ops | grep -q . || { echo "::error::named volumes were removed by dev:infra:down; they must survive"; exit 1; }

      - name: Diagnostics on failure (services, exit codes, health, logs)
        if: failure()
        run: |
          docker compose ps -a --format 'table {{.Service}}\t{{.State}}\t{{.ExitCode}}\t{{.Health}}\t{{.Status}}' || docker compose ps -a
          docker ps -a --filter name=smoke- --format 'table {{.Names}}\t{{.Status}}'
          docker compose logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: |
          docker rm -f smoke-web smoke-api > /dev/null 2>&1 || true
          docker compose down -v --remove-orphans
