# CI pipeline (T-002). Required for every PR into `main` and for every push to `main`.
# Checks: lint, typecheck, test, build (Turborepo, cached), Prettier, Conventional Commits.
# Actions are pinned by commit SHA (threat model TM-21); Dependabot keeps the pins fresh.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0 # do not install git hooks on the runner
  TURBO_TELEMETRY_DISABLED: 1
  DO_NOT_TRACK: 1
  CI: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm (version from package.json#packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node (version from .nvmrc) and pnpm store cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Restore Turborepo cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, test, build
        run: pnpm turbo lint typecheck test build

      - name: Prettier
        run: pnpm format:check

  commitlint:
    name: Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout (full history, needed to lint the PR commit range)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup pnpm (version from package.json#packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node (version from .nvmrc) and pnpm store cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint PR commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm exec commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  # --- db-integration (T-005) ------------------------------------------------------------------
  # Docker is not available on the local machine (decision 2026-10-13), so the database baseline is
  # proven here: `pnpm db:migrate` from an empty PostgreSQL 17 service, `pnpm db:seed` twice (idempotent),
  # then the Testcontainers suite of packages/domain (append-only triggers, unique/partial indexes,
  # mandatory timezone). Credentials below are throwaway values for the ephemeral CI service only.
  db-integration:
    name: Database (migrate, seed, Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # Tag + digest (TM-21); same reference in the Testcontainers suite and in the Compose file
        # (T-003). Dependabot `docker` ecosystem (enabled by T-003) proposes digest updates.
        image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: linkedin_ops_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d linkedin_ops_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/linkedin_ops_ci
      # db:seed / db:reset refuse any NODE_ENV outside {development, test} (packages/domain/src/env/guards.ts).
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm (version from package.json#packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: Setup Node (version from .nvmrc) and pnpm store cache
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate Prisma schema and build the domain package (generates the client)
        run: |
          pnpm --filter @linkedin-ops/domain db:validate
          pnpm turbo build --filter=@linkedin-ops/domain

      - name: Migrate from scratch (acceptance criterion `pnpm db:migrate`)
        run: pnpm db:migrate

      - name: Seed twice (acceptance criterion `pnpm db:seed`, idempotent)
        run: |
          pnpm db:seed
          pnpm db:seed

      - name: No pending migrations
        run: pnpm db:migrate:status

      - name: Integration tests (Testcontainers, postgres:17-alpine)
        run: pnpm db:test

  # --- compose-smoke (ativado em T-003) -------------------------------------------------------
  # Decision by Rodrigo (2026-10-13): Docker is not available on the local machine, so T-003
  # (Docker Compose dev environment) is validated here in CI instead. T-003 uncomments and
  # completes this job: bring up `infra/docker/docker-compose.yml` (postgres, minio), wait for
  # the health checks, build the api/web/worker images. Kept commented (not `if: false`) so
  # actionlint stays clean and no runner minutes are spent before the compose files exist.
  #
  # compose-smoke:
  #   name: Compose smoke
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 15
  #   steps:
  #     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #     - run: docker compose -f infra/docker/docker-compose.yml up -d --wait postgres minio
  #     - run: docker compose -f infra/docker/docker-compose.yml ps
  #     - run: docker compose -f infra/docker/docker-compose.yml build api web worker
