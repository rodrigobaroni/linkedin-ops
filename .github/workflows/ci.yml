  # compose-smoke:
  #   name: Compose smoke
  #   runs-on: ubuntu-latest
  #   timeout-minutes: 15
  #   steps:
  #     - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
  #     - run: docker compose -f infra/docker/docker-compose.yml up -d --wait postgres minio
  #     - run: docker compose -f infra/docker/docker-compose.yml ps
  #     - run: docker compose -f infra/docker/docker-compose.yml build api web worker
