# Dependency updates (T-002). Weekly, grouped, with Conventional Commit prefixes so the
# `commitlint` CI job accepts Dependabot's commits. Action bumps keep the SHA pins (TM-21).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    ignore:
      # typescript-eslint (8.x) declares peer typescript <6.1.0; TypeScript 7 (native
      # compiler) is a tooling change that requires an ADR, not an automatic bump.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # @types/node must follow the runtime pinned in .nvmrc/engines (Node 24), not lead it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      npm-major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns: ["*"]

  # Container images referenced by infra/docker/*.yml and apps/*/Dockerfile (tags + digests, TM-21).
  - package-ecosystem: docker
    directories:
      - /infra/docker
      - /apps/api
      - /apps/web
      - /apps/worker
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      docker-images:
        patterns: ["*"]
