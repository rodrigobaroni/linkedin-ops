packages:
  - "apps/*"
  - "packages/*"
  - "tests/e2e"

# Single source of truth for toolchain versions shared by every workspace (`"catalog:"` in package.json).
catalog:
  "@types/node": ^24.0.0
  eslint: ^10.12.0
  prettier: ^3.9.10
  typescript: ~5.9.3
  vitest: ^5.0.5
  zod: ^4.6.7
  # Database (T-005, ADR-0001): Prisma 7 (`prisma-client` generator + pg driver adapter), pinned together.
  prisma: 7.10.1
  "@prisma/client": 7.10.1
  "@prisma/adapter-pg": 7.10.1
  pg: ^8.23.1
  "@types/pg": ^8.23.1
  # Argon2id password hashing (ADR-0007); uuid v7 ids generated in the application (data-model.md).
  argon2: ^0.45.1
  uuid: ^14.0.3
  # Integration tests against a real PostgreSQL (Testcontainers); TS runner for seed scripts.
  "@testcontainers/postgresql": ^12.2.1
  tsx: ^4.21.0
  # Web auth (T-015): forms, API mocking for dev/Vitest (devDependency only; never in the production bundle).
  react-hook-form: ^7.90.0
  "@hookform/resolvers": ^6.0.0
  msw: ^3.0.3
  # API (T-008, ADR-0001): NestJS 12 on Fastify, pinned exactly (two-week soak rule; Dependabot bumps).
  # `fastify` tracks the exact version @nestjs/platform-fastify depends on so a single copy is installed.
  "@nestjs/common": 12.1.3
  "@nestjs/core": 12.1.3
  "@nestjs/platform-fastify": 12.1.3
  "@nestjs/testing": 12.1.3
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.2
  fastify: 5.12.5
  "@fastify/cookie": ^11.1.3
  "@fastify/helmet": ^13.2.0
  "@fastify/static": ^10.1.6
  # Structured logging (ADR-0001): Pino through nestjs-pino; pino-pretty only for local development.
  nestjs-pino: ^5.3.1
  pino: ^10.4.0
  pino-http: ^11.0.0
  pino-pretty: ^13.2.0
  # HTTP tests (Supertest) and the Swagger UI served at /docs in development only.
  supertest: ^7.3.1
  "@types/supertest": ^7.2.1
  swagger-ui-dist: ^5.34.0

# pnpm 10 blocks install scripts by default. Only these packages may run them (T-005): the Prisma CLI and
# its schema engine download, argon2's native binding, and esbuild (used by tsx and Vitest).
onlyBuiltDependencies:
  - "@prisma/engines"
  - argon2
  - esbuild
  - prisma
