<!doctype html>
<html lang="pt-BR">
  <head>
    <title>Entre no LinkedIn</title>
  </head>
  <body>
    <main class="authwall">
      <h1>Entre para ver esta vaga</h1>
      <form action="/uas/login-submit" method="post">
        <input type="text" name="session_key" placeholder="E-mail ou telefone" />
        <input type="password" name="session_password" placeholder="Senha" />
        <button type="submit">Entrar</button>
      </form>
      <p>Novo no LinkedIn? Cadastre-se agora.</p>
    </main>
  </body>
</html>
